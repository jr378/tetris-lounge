<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <rect width="400" height="560" fill="#121417"/>
  <!-- Border frame -->
  <rect x="12" y="12" width="376" height="536" rx="4" fill="none" stroke="#F3EFE6" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- Concentric circles motif -->
  <circle cx="200" cy="220" r="140" fill="none" stroke="#2D6F73" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="200" cy="220" r="110" fill="none" stroke="#2D6F73" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="200" cy="220" r="80" fill="none" stroke="#2D6F73" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="200" cy="220" r="50" fill="none" stroke="#2D6F73" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="200" cy="220" r="20" fill="#2D6F73" fill-opacity="0.2"/>
  <!-- Top eyebrow -->
  <text x="200" y="52" text-anchor="middle" fill="#F3EFE6" fill-opacity="0.5" font-family="sans-serif" font-size="11" letter-spacing="3">LIVE ON STAGE</text>
  <line x1="80" y1="62" x2="320" y2="62" stroke="#F3EFE6" stroke-opacity="0.1" stroke-width="0.5"/>
  <!-- Band name -->
  <text x="200" y="420" text-anchor="middle" fill="#F3EFE6" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="1">TETRIS LOUNGE</text>
  <text x="200" y="448" text-anchor="middle" fill="#F3EFE6" fill-opacity="0.5" font-family="sans-serif" font-size="14" letter-spacing="4">/</text>
  <text x="200" y="476" text-anchor="middle" fill="#F3EFE6" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="1">NOWHERE MEN</text>
  <!-- Bottom -->
  <line x1="80" y1="500" x2="320" y2="500" stroke="#2D6F73" stroke-opacity="0.4" stroke-width="1"/>
  <text x="200" y="524" text-anchor="middle" fill="#2D6F73" font-family="sans-serif" font-size="11" letter-spacing="2">TWO ACTS, ONE BAND</text>
  <text x="200" y="542" text-anchor="middle" fill="#F3EFE6" fill-opacity="0.3" font-family="sans-serif" font-size="9">SAMPLE POSTER</text>
</svg>
