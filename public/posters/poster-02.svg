<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <rect width="400" height="560" fill="#FBF4E8"/>
  <!-- Ticket stub corners -->
  <rect x="0" y="0" width="20" height="20" fill="#121417"/>
  <rect x="380" y="0" width="20" height="20" fill="#121417"/>
  <rect x="0" y="540" width="20" height="20" fill="#121417"/>
  <rect x="380" y="540" width="20" height="20" fill="#121417"/>
  <!-- Dashed ticket edge -->
  <line x1="0" y1="420" x2="400" y2="420" stroke="#121417" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8,6"/>
  <!-- Halftone dot pattern -->
  <g fill="#2D6F73" fill-opacity="0.06">
    <circle cx="40" cy="80" r="4"/><circle cx="80" cy="80" r="6"/><circle cx="120" cy="80" r="8"/>
    <circle cx="160" cy="80" r="10"/><circle cx="200" cy="80" r="12"/><circle cx="240" cy="80" r="10"/>
    <circle cx="280" cy="80" r="8"/><circle cx="320" cy="80" r="6"/><circle cx="360" cy="80" r="4"/>
    <circle cx="40" cy="120" r="6"/><circle cx="80" cy="120" r="8"/><circle cx="120" cy="120" r="10"/>
    <circle cx="160" cy="120" r="12"/><circle cx="200" cy="120" r="14"/><circle cx="240" cy="120" r="12"/>
    <circle cx="280" cy="120" r="10"/><circle cx="320" cy="120" r="8"/><circle cx="360" cy="120" r="6"/>
    <circle cx="40" cy="160" r="4"/><circle cx="80" cy="160" r="6"/><circle cx="120" cy="160" r="8"/>
    <circle cx="160" cy="160" r="10"/><circle cx="200" cy="160" r="12"/><circle cx="240" cy="160" r="10"/>
    <circle cx="280" cy="160" r="8"/><circle cx="320" cy="160" r="6"/><circle cx="360" cy="160" r="4"/>
  </g>
  <!-- Main text -->
  <text x="200" y="240" text-anchor="middle" fill="#121417" font-family="sans-serif" font-size="14" letter-spacing="5" font-weight="600">PRESENTING</text>
  <text x="200" y="290" text-anchor="middle" fill="#121417" font-family="sans-serif" font-size="36" font-weight="800">NOWHERE</text>
  <text x="200" y="330" text-anchor="middle" fill="#121417" font-family="sans-serif" font-size="36" font-weight="800">MEN</text>
  <rect x="140" y="345" width="120" height="3" fill="#2D6F73"/>
  <text x="200" y="375" text-anchor="middle" fill="#2D6F73" font-family="sans-serif" font-size="13" letter-spacing="2" font-weight="600">BEATLES TRIBUTE</text>
  <!-- Ticket stub -->
  <text x="200" y="455" text-anchor="middle" fill="#121417" fill-opacity="0.4" font-family="sans-serif" font-size="11" letter-spacing="3">ADMIT ONE</text>
  <text x="200" y="490" text-anchor="middle" fill="#121417" font-family="sans-serif" font-size="20" font-weight="700">TETRIS LOUNGE</text>
  <text x="200" y="510" text-anchor="middle" fill="#121417" fill-opacity="0.5" font-family="sans-serif" font-size="12" letter-spacing="1">/ NOWHERE MEN</text>
  <text x="200" y="540" text-anchor="middle" fill="#121417" fill-opacity="0.25" font-family="sans-serif" font-size="9">SAMPLE POSTER</text>
</svg>
