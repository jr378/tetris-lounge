<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <rect width="400" height="560" fill="#1B1F24"/>
  <!-- Stage light beams -->
  <polygon points="200,0 100,280 300,280" fill="#2D6F73" fill-opacity="0.06"/>
  <polygon points="120,0 40,280 200,280" fill="#2D6F73" fill-opacity="0.04"/>
  <polygon points="280,0 200,280 360,280" fill="#2D6F73" fill-opacity="0.04"/>
  <!-- Horizontal rules -->
  <line x1="40" y1="300" x2="360" y2="300" stroke="#F3EFE6" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="40" y1="302" x2="360" y2="302" stroke="#F3EFE6" stroke-opacity="0.08" stroke-width="0.5"/>
  <!-- Top label -->
  <rect x="130" y="40" width="140" height="28" rx="2" fill="#2D6F73" fill-opacity="0.2"/>
  <text x="200" y="59" text-anchor="middle" fill="#F3EFE6" font-family="sans-serif" font-size="11" letter-spacing="4" font-weight="600">TWO ACTS</text>
  <!-- Band names stacked -->
  <text x="200" y="160" text-anchor="middle" fill="#F3EFE6" font-family="sans-serif" font-size="42" font-weight="800" letter-spacing="2">TETRIS</text>
  <text x="200" y="210" text-anchor="middle" fill="#F3EFE6" font-family="sans-serif" font-size="42" font-weight="800" letter-spacing="2">LOUNGE</text>
  <text x="200" y="250" text-anchor="middle" fill="#2D6F73" font-family="sans-serif" font-size="16" letter-spacing="6">&amp;</text>
  <text x="200" y="285" text-anchor="middle" fill="#F3EFE6" fill-opacity="0.8" font-family="sans-serif" font-size="24" font-weight="700" letter-spacing="3">NOWHERE MEN</text>
  <!-- Description block -->
  <text x="200" y="350" text-anchor="middle" fill="#F3EFE6" fill-opacity="0.45" font-family="sans-serif" font-size="11" letter-spacing="1">CLASSIC ROCK COVERS</text>
  <circle cx="200" cy="370" r="2" fill="#2D6F73" fill-opacity="0.5"/>
  <text x="200" y="395" text-anchor="middle" fill="#F3EFE6" fill-opacity="0.45" font-family="sans-serif" font-size="11" letter-spacing="1">HIGH-FIDELITY BEATLES TRIBUTE</text>
  <!-- Bottom block -->
  <rect x="40" y="460" width="320" height="1" fill="#F3EFE6" fill-opacity="0.08"/>
  <text x="200" y="495" text-anchor="middle" fill="#F3EFE6" fill-opacity="0.6" font-family="sans-serif" font-size="18" font-weight="600">LIVE</text>
  <text x="200" y="530" text-anchor="middle" fill="#F3EFE6" fill-opacity="0.25" font-family="sans-serif" font-size="9">SAMPLE POSTER</text>
</svg>
