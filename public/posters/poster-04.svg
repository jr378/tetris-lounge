<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <rect width="400" height="560" fill="#F5ECDC"/>
  <!-- Geometric border -->
  <rect x="16" y="16" width="368" height="528" fill="none" stroke="#121417" stroke-width="2"/>
  <rect x="22" y="22" width="356" height="516" fill="none" stroke="#121417" stroke-opacity="0.3" stroke-width="0.5"/>
  <!-- Abstract geometric: stacked rectangles -->
  <rect x="60" y="60" width="120" height="80" fill="#121417" fill-opacity="0.08"/>
  <rect x="100" y="90" width="120" height="80" fill="#2D6F73" fill-opacity="0.1"/>
  <rect x="180" y="60" width="120" height="80" fill="#121417" fill-opacity="0.05"/>
  <rect x="220" y="90" width="120" height="80" fill="#2D6F73" fill-opacity="0.08"/>
  <!-- Text block -->
  <text x="200" y="230" text-anchor="middle" fill="#121417" fill-opacity="0.4" font-family="sans-serif" font-size="11" letter-spacing="4">AN EVENING WITH</text>
  <line x1="60" y1="245" x2="340" y2="245" stroke="#121417" stroke-opacity="0.1" stroke-width="0.5"/>
  <text x="200" y="295" text-anchor="middle" fill="#121417" font-family="sans-serif" font-size="32" font-weight="800">TETRIS LOUNGE</text>
  <text x="200" y="330" text-anchor="middle" fill="#121417" fill-opacity="0.4" font-family="sans-serif" font-size="16" letter-spacing="6">/</text>
  <text x="200" y="365" text-anchor="middle" fill="#121417" font-family="sans-serif" font-size="26" font-weight="700">NOWHERE MEN</text>
  <line x1="60" y1="385" x2="340" y2="385" stroke="#121417" stroke-opacity="0.1" stroke-width="0.5"/>
  <!-- Feature list -->
  <text x="200" y="420" text-anchor="middle" fill="#2D6F73" font-family="sans-serif" font-size="12" letter-spacing="2" font-weight="600">CLASSIC ROCK</text>
  <circle cx="200" cy="438" r="2" fill="#121417" fill-opacity="0.2"/>
  <text x="200" y="460" text-anchor="middle" fill="#2D6F73" font-family="sans-serif" font-size="12" letter-spacing="2" font-weight="600">BEATLES TRIBUTE</text>
  <circle cx="200" cy="478" r="2" fill="#121417" fill-opacity="0.2"/>
  <text x="200" y="500" text-anchor="middle" fill="#2D6F73" font-family="sans-serif" font-size="12" letter-spacing="2" font-weight="600">TWO ACTS, ONE BAND</text>
  <!-- Bottom -->
  <text x="200" y="535" text-anchor="middle" fill="#121417" fill-opacity="0.2" font-family="sans-serif" font-size="9">SAMPLE POSTER</text>
</svg>
